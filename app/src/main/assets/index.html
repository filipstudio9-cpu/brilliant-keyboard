<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>BrilliantKeyboard</title>
  <style>
    :root {
      --kb-bg: #ffffff;
      --kb-key-bg: rgba(123, 237, 159, 0.85);
      --kb-key-text: #0b3d20;
      --kb-key-special-bg: rgba(46, 213, 115, 0.85);
      --kb-key-shadow: 0 3px 0 #1e9e54;
      --kb-bar-bg: rgba(241, 242, 246, 0.9);
      --kb-bar-text: #1e272e;
      --kb-accent: #00a8ff;
    }

    [data-kb-theme="dark"] {
      --kb-bg: #121417;
      --kb-key-bg: #1e2229;
      --kb-key-text: #7bed9f;
      --kb-key-special-bg: #282d37;
      --kb-key-shadow: 0 3px 0 #0b0c0e;
      --kb-bar-bg: #181b20;
      --kb-bar-text: #dfe4ea;
      --kb-accent: #7bed9f;
    }

    [data-kb-theme="light"] {
      --kb-bg: #eef2f5;
      --kb-key-bg: #ffffff;
      --kb-key-text: #1e272e;
      --kb-key-special-bg: #dfe6e9;
      --kb-key-shadow: 0 3px 0 #b2bec3;
      --kb-bar-bg: #dfe6e9;
      --kb-bar-text: #2d3436;
      --kb-accent: #0984e3;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: transparent;
    }

    #brilliant-keyboard {
      position: relative;
      width: 100%;
      height: 100%;
      background-color: var(--kb-bg);
      background-size: cover;
      background-position: center;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Плавающий голубой свет по белому фону в системной теме */
    .kb-glow-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
      display: none;
    }

    [data-kb-theme="system"] .kb-glow-layer {
      display: block;
    }

    .glow-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(28px);
      opacity: 0.75;
      animation: floatBlue 7s ease-in-out infinite alternate;
    }

    .glow-orb.orb1 {
      width: 190px;
      height: 190px;
      background: #00c6ff;
      top: -20px;
      left: -20px;
    }

    .glow-orb.orb2 {
      width: 220px;
      height: 220px;
      background: #48dbfb;
      bottom: -30px;
      right: -20px;
      animation-delay: -3.5s;
    }

    @keyframes floatBlue {
      0% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(60px, 25px) scale(1.15); }
      100% { transform: translate(20px, -20px) scale(0.95); }
    }

    .kb-top-bar {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--kb-bar-bg);
      height: 38px;
      padding: 0 6px;
      border-bottom: 1px solid rgba(128,128,128,0.15);
    }

    .kb-suggestions {
      display: flex;
      flex: 1;
      height: 100%;
      align-items: center;
      justify-content: space-around;
      overflow: hidden;
    }

    .kb-suggestions.hidden {
      visibility: hidden;
    }

    .kb-word-chip {
      flex: 1;
      text-align: center;
      color: var(--kb-bar-text);
      font-size: 13px;
      font-weight: 600;
      padding: 4px;
      border-radius: 6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .kb-word-chip.primary {
      color: #007bb8;
      font-weight: 800;
    }

    .kb-tools {
      display: flex;
      gap: 2px;
      padding-left: 4px;
      border-left: 1px solid rgba(128,128,128,0.2);
    }

    .kb-tool-btn {
      background: transparent;
      border: none;
      font-size: 17px;
      width: 32px;
      height: 32px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .kb-tool-btn.active {
      background: var(--kb-accent);
      color: #fff;
    }

    .kb-keys-container {
      position: relative;
      z-index: 2;
      flex: 1;
      padding: 5px 4px 6px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 5px;
    }

    .kb-row {
      display: flex;
      justify-content: center;
      gap: 4px;
      width: 100%;
      flex: 1;
    }

    .kb-key {
      position: relative;
      flex: 1;
      background: var(--kb-key-bg);
      color: var(--kb-key-text);
      border: none;
      border-radius: 8px;
      font-size: 18px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: var(--kb-key-shadow);
      backdrop-filter: blur(4px);
      touch-action: manipulation;
    }

    .kb-key::after {
      content: "";
      position: absolute;
      inset: -3px -2px;
    }

    .kb-key:active {
      transform: translateY(2px) scale(0.95);
      filter: brightness(1.1);
    }

    .kb-row.num-row {
      flex: 0.78;
    }

    .kb-row.num-row .kb-key {
      font-size: 14px;
      border-radius: 6px;
    }

    .kb-key.special {
      background: var(--kb-key-special-bg);
      font-size: 15px;
      flex: 1.35;
    }

    .kb-key.shift-active {
      background: #00a8ff !important;
      color: #ffffff !important;
    }

    .kb-key.space {
      flex: 4.2;
      font-size: 12px;
    }

    .kb-key.enter {
      flex: 1.6;
      background: #00a8ff;
      color: #ffffff;
      box-shadow: 0 3px 0 #007bb8;
    }

    .kb-panel {
      position: relative;
      z-index: 2;
      flex: 1;
      overflow-y: auto;
      padding: 10px;
      color: var(--kb-bar-text);
      background: var(--kb-bg);
      display: none;
    }

    .kb-panel.active {
      display: block;
    }

    .emoji-grid {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 4px;
      text-align: center;
    }

    .emoji-item {
      font-size: 22px;
      padding: 4px 0;
    }

    .clip-item {
      background: var(--kb-key-bg);
      color: var(--kb-key-text);
      padding: 8px 10px;
      border-radius: 8px;
      margin-bottom: 6px;
      font-size: 13px;
      font-weight: 600;
      box-shadow: var(--kb-key-shadow);
    }

    .settings-group {
      margin-bottom: 10px;
      background: var(--kb-bar-bg);
      padding: 8px 10px;
      border-radius: 8px;
    }

    .settings-title {
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .theme-selector {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 5px;
    }

    .theme-btn {
      padding: 6px;
      border-radius: 6px;
      border: 2px solid transparent;
      background: var(--kb-bg);
      color: var(--kb-bar-text);
      font-size: 12px;
      font-weight: 600;
    }

    .theme-btn.selected {
      border-color: var(--kb-accent);
    }

    .setting-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 0;
      font-size: 13px;
    }

    .lang-chip {
      display: inline-block;
      padding: 4px 8px;
      margin: 3px;
      border-radius: 6px;
      background: var(--kb-bg);
      font-size: 12px;
      border: 1px solid rgba(128,128,128,0.3);
    }

    .lang-chip.installed {
      background: var(--kb-key-bg);
      color: var(--kb-key-text);
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div id="brilliant-keyboard" data-kb-theme="system">
    <div class="kb-glow-layer">
      <div class="glow-orb orb1"></div>
      <div class="glow-orb orb2"></div>
    </div>

    <div class="kb-top-bar">
      <div id="kbSuggestions" class="kb-suggestions"></div>
      <div class="kb-tools">
        <button class="kb-tool-btn" data-panel="emoji">😊</button>
        <button class="kb-tool-btn" data-panel="clipboard">📋</button>
        <button class="kb-tool-btn" data-panel="settings">⚙️</button>
      </div>
    </div>

    <div id="kbMainKeys" class="kb-keys-container"></div>

    <div id="panel-emoji" class="kb-panel">
      <div class="emoji-grid" id="emojiGrid"></div>
    </div>

    <div id="panel-clipboard" class="kb-panel">
      <div style="font-size:12px; font-weight:700; margin-bottom:6px;">Буфер обмена (нажмите для вставки):</div>
      <div id="clipboardList"></div>
    </div>

    <div id="panel-settings" class="kb-panel">
      <div class="settings-group">
        <div class="settings-title">🎨 Тема клавиатуры</div>
        <div class="theme-selector">
          <button class="theme-btn" data-set-theme="system">Системная</button>
          <button class="theme-btn" data-set-theme="dark">Тёмная</button>
          <button class="theme-btn" data-set-theme="light">Светлая</button>
          <button class="theme-btn" data-set-theme="hybrid">Гибридная</button>
        </div>
      </div>

      <div class="settings-group">
        <div class="settings-title">🖼️ Фото под кнопками</div>
        <input type="file" id="bgImageInput" accept="image/*" style="font-size:11px;">
        <button id="resetBgBtn" style="font-size:11px; padding:4px 8px;">Сброс</button>
      </div>

      <div class="settings-group">
        <div class="settings-title">🧠 Т9 и Подсказки</div>
        <div class="setting-row">
          <span>Умный Т9</span>
          <input type="checkbox" id="toggleT9" checked>
        </div>
        <div class="setting-row">
          <span>Панель подсказок</span>
          <input type="checkbox" id="toggleSuggestions" checked>
        </div>
      </div>

      <div class="settings-group">
        <div class="settings-title">🌍 Языки</div>
        <div id="langManager"></div>
      </div>
    </div>
  </div>

  <script>
    (function() {
      const kbEl = document.getElementById('brilliant-keyboard');
      const keysContainer = document.getElementById('kbMainKeys');

      let state = {
        theme: 'system',
        t9Enabled: true,
        suggestionsEnabled: true,
        installedLangs: ['ru', 'en'],
        currentLang: 'ru',
        customBg: null
      };

      try {
        const saved = localStorage.getItem('bk_ime_state');
        if (saved) state = Object.assign(state, JSON.parse(saved));
      } catch (e) {}

      function saveState() {
        try { localStorage.setItem('bk_ime_state', JSON.stringify(state)); } catch (e) {}
      }

      let isShift = false;
      let isSymbols = false;
      let activePanel = null;
      let currentWordBuffer = '';
      let deleteTimer = null;

      const clipboardHistory = [
        'Привет! Пишу с BrilliantKeyboard ✨',
        'Как дела?',
        'Скоро буду'
      ];

      const languages = {
        ru: {
          name: 'Русский',
          code: 'RU',
          rows: [
            ['1','2','3','4','5','6','7','8','9','0'],
            ['й','ц','у','к','е','н','г','ш','щ','з','х'],
            ['ф','ы','в','а','п','р','о','л','д','ж','э'],
            ['SHIFT','я','ч','с','м','и','т','ь','б','ю','BACK'],
            ['SYM','LANG',',','SPACE','.','ENTER']
          ]
        },
        en: {
          name: 'English',
          code: 'EN',
          rows: [
            ['1','2','3','4','5','6','7','8','9','0'],
            ['q','w','e','r','t','y','u','i','o','p'],
            ['a','s','d','f','g','h','j','k','l'],
            ['SHIFT','z','x','c','v','b','n','m','BACK'],
            ['SYM','LANG',',','SPACE','.','ENTER']
          ]
        },
        es: {
          name: 'Español',
          code: 'ES',
          rows: [
            ['1','2','3','4','5','6','7','8','9','0'],
            ['q','w','e','r','t','y','u','i','o','p'],
            ['a','s','d','f','g','h','j','k','l','ñ'],
            ['SHIFT','z','x','c','v','b','n','m','BACK'],
            ['SYM','LANG',',','SPACE','.','ENTER']
          ]
        }
      };

      const symbolRows = [
        ['1','2','3','4','5','6','7','8','9','0'],
        ['@','#','₽','$','_','&','-','+','(',')'],
        ['*','"',"'",':',';','!','?','/','~','%'],
        ['ABC','«','»','[',']','{','}','=','+','BACK'],
        ['ABC','LANG',',','SPACE','.','ENTER']
      ];

      const dictionary = [
        'привет', 'как', 'дела', 'что', 'ты', 'делаешь', 'сегодня', 'завтра',
        'хорошо', 'отлично', 'спасибо', 'пожалуйста', 'клавиатура', 'работает',
        'супер', 'круто', 'можно', 'нужно', 'будет', 'время', 'телефон',
        'hello', 'how', 'are', 'you', 'good', 'thanks', 'keyboard', 'brilliant'
      ];

      function sendToAndroid(text) {
        if (window.AndroidIME && window.AndroidIME.commitText) {
          window.AndroidIME.commitText(text);
        }
      }

      function deleteInAndroid() {
        if (window.AndroidIME && window.AndroidIME.deleteBackward) {
          window.AndroidIME.deleteBackward();
        }
      }

      function enterInAndroid() {
        if (window.AndroidIME && window.AndroidIME.sendEnter) {
          window.AndroidIME.sendEnter();
        }
      }

      function vibrateDevice() {
        if (window.AndroidIME && window.AndroidIME.vibrate) {
          window.AndroidIME.vibrate(15);
        } else if (navigator.vibrate) {
          navigator.vibrate(15);
        }
      }

      function applyTheme() {
        let t = state.theme;
        if (t === 'hybrid') {
          const h = new Date().getHours();
          t = (h >= 7 && h < 19) ? 'light' : 'dark';
        }
        kbEl.setAttribute('data-kb-theme', t);
      }

      function applyCustomBg() {
        if (state.customBg) {
          kbEl.style.backgroundImage = `url(${state.customBg})`;
        } else {
          kbEl.style.backgroundImage = 'none';
        }
      }

      function updateSuggestions() {
        const box = document.getElementById('kbSuggestions');
        if (!state.suggestionsEnabled) {
          box.classList.add('hidden');
          return;
        }
        box.classList.remove('hidden');

        const w = currentWordBuffer.toLowerCase();
        let list = [];
        if (w.length > 0) {
          list = dictionary.filter(item => item.startsWith(w) && item !== w).slice(0, 3);
        } else {
          list = ['Привет', 'Как дела?', 'Спасибо'];
        }
        while (list.length < 3) list.push('');

        box.innerHTML = '';
        list.forEach((word, idx) => {
          const chip = document.createElement('div');
          chip.className = 'kb-word-chip' + (idx === 0 ? ' primary' : '');
          chip.textContent = word;
          if (word) {
            chip.addEventListener('pointerdown', (e) => {
              e.preventDefault();
              vibrateDevice();
              if (w.length > 0) {
                for (let i = 0; i < currentWordBuffer.length; i++) deleteInAndroid();
                sendToAndroid(word + ' ');
                currentWordBuffer = '';
              } else {
                sendToAndroid(word + ' ');
              }
              updateSuggestions();
            });
          }
          box.appendChild(chip);
        });
      }

      function renderKeys() {
        keysContainer.innerHTML = '';
        const langObj = languages[state.currentLang] || languages.ru;
        const rows = isSymbols ? symbolRows : langObj.rows;

        rows.forEach((row, rIdx) => {
          const rowEl = document.createElement('div');
          rowEl.className = 'kb-row' + (rIdx === 0 ? ' num-row' : '');

          row.forEach(k => {
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'kb-key';

            if (k === 'SHIFT') {
              btn.textContent = '⇧';
              btn.classList.add('special');
              if (isShift) btn.classList.add('shift-active');
            } else if (k === 'BACK') {
              btn.textContent = '⌫';
              btn.classList.add('special');
            } else if (k === 'SYM' || k === 'ABC') {
              btn.textContent = k === 'SYM' ? '?123' : 'АБВ';
              btn.classList.add('special');
            } else if (k === 'LANG') {
              btn.textContent = '🌐 ' + langObj.code;
              btn.classList.add('special');
            } else if (k === 'SPACE') {
              btn.textContent = 'BrilliantKeyboard';
              btn.classList.add('space');
            } else if (k === 'ENTER') {
              btn.textContent = '↵';
              btn.classList.add('enter');
            } else {
              btn.textContent = isShift ? k.toUpperCase() : k;
            }

            btn.addEventListener('pointerdown', (e) => {
              e.preventDefault();
              vibrateDevice();

              if (k === 'SHIFT') {
                isShift = !isShift;
                renderKeys();
              } else if (k === 'SYM') {
                isSymbols = true;
                renderKeys();
              } else if (k === 'ABC') {
                isSymbols = false;
                renderKeys();
              } else if (k === 'LANG') {
                const idx = state.installedLangs.indexOf(state.currentLang);
                state.currentLang = state.installedLangs[(idx + 1) % state.installedLangs.length];
                saveState();
                renderKeys();
              } else if (k === 'BACK') {
                deleteInAndroid();
                currentWordBuffer = currentWordBuffer.slice(0, -1);
                updateSuggestions();
                deleteTimer = setInterval(() => {
                  deleteInAndroid();
                  currentWordBuffer = currentWordBuffer.slice(0, -1);
                }, 80);
              } else if (k === 'SPACE') {
                if (state.t9Enabled && currentWordBuffer.length > 2 && !dictionary.includes(currentWordBuffer.toLowerCase())) {
                  dictionary.push(currentWordBuffer.toLowerCase());
                }
                currentWordBuffer = '';
                sendToAndroid(' ');
                updateSuggestions();
              } else if (k === 'ENTER') {
                currentWordBuffer = '';
                enterInAndroid();
                updateSuggestions();
              } else {
                const out = isShift ? k.toUpperCase() : k;
                sendToAndroid(out);
                if (/[а-яА-ЯёЁa-zA-Z]/.test(out)) {
                  currentWordBuffer += out;
                } else {
                  currentWordBuffer = '';
                }
                if (isShift) {
                  isShift = false;
                  renderKeys();
                }
                updateSuggestions();
              }
            });

            btn.addEventListener('pointerup', () => clearInterval(deleteTimer));
            btn.addEventListener('pointerleave', () => clearInterval(deleteTimer));

            rowEl.appendChild(btn);
          });
          keysContainer.appendChild(rowEl);
        });
      }

      document.querySelectorAll('.kb-tool-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const p = btn.dataset.panel;
          document.querySelectorAll('.kb-panel').forEach(el => el.classList.remove('active'));
          document.querySelectorAll('.kb-tool-btn').forEach(b => b.classList.remove('active'));

          if (activePanel === p) {
            activePanel = null;
            keysContainer.style.display = 'flex';
          } else {
            activePanel = p;
            keysContainer.style.display = 'none';
            document.getElementById('panel-' + p).classList.add('active');
            btn.classList.add('active');
          }
        });
      });

      const emojis = ['😀','😂','🥰','😎','🤔','😭','😡','🤯','👍','👎','🔥','❤️','✨','🎉','💯','🙏','🚀','💻','📱','💡','⚡','🌟','🎵','🎮'];
      const emojiGrid = document.getElementById('emojiGrid');
      emojis.forEach(em => {
        const d = document.createElement('div');
        d.className = 'emoji-item';
        d.textContent = em;
        d.addEventListener('pointerdown', (e) => {
          e.preventDefault();
          vibrateDevice();
          sendToAndroid(em);
        });
        emojiGrid.appendChild(d);
      });

      const clipList = document.getElementById('clipboardList');
      clipboardHistory.forEach(txt => {
        const item = document.createElement('div');
        item.className = 'clip-item';
        item.textContent = txt;
        item.addEventListener('pointerdown', (e) => {
          e.preventDefault();
          vibrateDevice();
          sendToAndroid(txt);
        });
        clipList.appendChild(item);
      });

      document.querySelectorAll('.theme-btn').forEach(btn => {
        if (btn.dataset.setTheme === state.theme) btn.classList.add('selected');
        btn.addEventListener('click', () => {
          document.querySelectorAll('.theme-btn').forEach(b => b.classList.remove('selected'));
          btn.classList.add('selected');
          state.theme = btn.dataset.setTheme;
          saveState();
          applyTheme();
        });
      });

      document.getElementById('bgImageInput').addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const r = new FileReader();
        r.onload = (ev) => {
          state.customBg = ev.target.result;
          saveState();
          applyCustomBg();
        };
        r.readAsDataURL(file);
      });

      document.getElementById('resetBgBtn').addEventListener('click', () => {
        state.customBg = null;
        saveState();
        applyCustomBg();
      });

      const t9Box = document.getElementById('toggleT9');
      const sugBox = document.getElementById('toggleSuggestions');
      t9Box.checked = state.t9Enabled;
      sugBox.checked = state.suggestionsEnabled;

      t9Box.addEventListener('change', () => { state.t9Enabled = t9Box.checked; saveState(); });
      sugBox.addEventListener('change', () => { state.suggestionsEnabled = sugBox.checked; saveState(); updateSuggestions(); });

      function renderLangManager() {
        const lm = document.getElementById('langManager');
        lm.innerHTML = '';
        Object.keys(languages).forEach(code => {
          const isInst = state.installedLangs.includes(code);
          const chip = document.createElement('span');
          chip.className = 'lang-chip' + (isInst ? ' installed' : '');
          chip.textContent = (isInst ? '✓ ' : '+ ') + languages[code].name;
          chip.addEventListener('click', () => {
            if (isInst && state.installedLangs.length > 1) {
              state.installedLangs = state.installedLangs.filter(c => c !== code);
              if (state.currentLang === code) state.currentLang = state.installedLangs[0];
            } else if (!isInst) {
              state.installedLangs.push(code);
            }
            saveState();
            renderLangManager();
            renderKeys();
          });
          lm.appendChild(chip);
        });
      }

      applyTheme();
      applyCustomBg();
      renderKeys();
      updateSuggestions();
      renderLangManager();
    })();
  </script>
</body>
</html>
